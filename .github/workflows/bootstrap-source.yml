name: Bootstrap SignalDock source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/source.part*'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part* > /tmp/signaldock-source.b64
          base64 --decode /tmp/signaldock-source.b64 > /tmp/SignalDock-bootstrap.tar.xz
          echo '600c8c31dd311816ebea7afd869c53996eca07f537675e3207392ab250940ae6  /tmp/SignalDock-bootstrap.tar.xz' | sha256sum --check --strict
          mkdir -p /tmp/signaldock-source
          tar -xJf /tmp/SignalDock-bootstrap.tar.xz -C /tmp/signaldock-source --strip-components=1
          test "$(cat /tmp/signaldock-source/VERSION)" = '2.4.0'

      - name: Import verified SignalDock v2.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a /tmp/signaldock-source/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: import SignalDock v2.4.0 source'
          git push origin HEAD:main
