name: Capture README app screenshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-readme-screenshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser automation for this one-time capture
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run SignalDock and capture the real v2.4.0 UI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/signaldock-http.log 2>&1 &
          echo $! >/tmp/signaldock-http.pid
          cat >/tmp/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          await page.goto('http://127.0.0.1:8766/', { waitUntil: 'domcontentloaded' });
          await page.setInputFiles('#fileInput', 'sample/signal-demo.ndjson');
          await page.waitForTimeout(1800);
          const rows = await page.locator('.log-row').count();
          if (rows < 1) throw new Error('Demo dataset did not render any log rows.');
          await page.screenshot({ path: 'docs/images/app-screenshot.png', fullPage: false });
          await browser.close();
          EOF
          node /tmp/capture.mjs
          test -s docs/images/app-screenshot.png

      - name: Add screenshot and CodeQL badge to README
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          ci = '    <a href="https://github.com/bren-wp/SignalDock/actions/workflows/ci.yml"><img alt="CI" src="https://github.com/bren-wp/SignalDock/actions/workflows/ci.yml/badge.svg"></a>\n'
          codeql = '    <a href="https://github.com/bren-wp/SignalDock/actions/workflows/codeql.yml"><img alt="CodeQL" src="https://github.com/bren-wp/SignalDock/actions/workflows/codeql.yml/badge.svg"></a>\n'
          if codeql not in text:
              text = text.replace(ci, ci + codeql)
          anchor = '''<p align="center">
            <img src="./docs/images/readme-hero.svg" alt="SignalDock product preview" width="100%" />
          </p>
          '''
          screenshot = '''<p align="center">
            <img src="./docs/images/readme-hero.svg" alt="SignalDock product preview" width="100%" />
          </p>

          <p align="center">
            <strong>SignalDock v2.4.0 — real application UI with the bundled demo dataset</strong><br>
            <img src="./docs/images/app-screenshot.png" alt="SignalDock v2.4.0 application screenshot showing local log analysis" width="100%" />
          </p>
          '''
          if 'docs/images/app-screenshot.png' not in text:
              text = text.replace(anchor, screenshot)
          p.write_text(text)

      - name: Commit the generated screenshot and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/capture-readme-screenshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md docs/images/app-screenshot.png .github/workflows/capture-readme-screenshot.yml
          git commit -m 'docs: add real SignalDock application screenshot'
          git push origin HEAD:main
