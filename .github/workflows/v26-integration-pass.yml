name: SignalDock v2.6 integration pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v26-integration-pass.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate v2.6 product changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          app_path = Path('app.js')
          app = app_path.read_text()
          app = replace_once(app, 'const APP_VERSION = "2.5.0";', 'const APP_VERSION = "2.6.0";', 'app version')
          app = replace_once(app,
              '    state.traceExplorerData = window.SignalDockTraceExplorer?.build?.(state.entries) || null;',
              '    state.traceExplorerData = window.SignalDockTraceExplorer?.buildWindow?.(state.entries, null, { limit: 1000 }) || window.SignalDockTraceExplorer?.build?.(state.entries) || null;',
              'trace explorer cached window')
          app = replace_once(app,
              '    if (el.traceExplorerCount) el.traceExplorerCount.textContent = (state.traceExplorerData?.rows?.length || 0).toLocaleString();',
              '    if (el.traceExplorerCount) el.traceExplorerCount.textContent = (state.traceExplorerData?.summary?.traces || state.traceExplorerData?.rows?.length || 0).toLocaleString();',
              'trace explorer count')
          app = replace_once(app,
              '    const data = scopedIndexes ? window.SignalDockTraceExplorer.build(state.entries, scopedIndexes) : (state.traceExplorerData || window.SignalDockTraceExplorer.build(state.entries));',
              '    const data = scopedIndexes ? window.SignalDockTraceExplorer.buildWindow(state.entries, scopedIndexes, { limit: 1000 }) : (state.traceExplorerData || window.SignalDockTraceExplorer.buildWindow(state.entries, null, { limit: 1000 }));',
              'trace explorer ui window')
          app = replace_once(app,
              '    if (el.traceExplorerMeta) el.traceExplorerMeta.textContent = `${state.traceExplorerScopeFiltered && scopedIndexes ? "Current filtered result" : "All loaded logs"} · explicit trace IDs only.`;',
              '    if (el.traceExplorerMeta) el.traceExplorerMeta.textContent = `${state.traceExplorerScopeFiltered && scopedIndexes ? "Current filtered result" : "All loaded logs"} · explicit trace IDs only${data.summary.truncated ? ` · showing ${data.summary.returned.toLocaleString()} of ${data.summary.traces.toLocaleString()} ranked traces` : ""}.`;',
              'trace explorer truncation meta')
          app_path.write_text(app)

          index_path = Path('index.html')
          index = index_path.read_text()
          index = replace_once(index,
              '  <script src="project-manager.js" defer></script>\n  <script src="app.js" defer></script>',
              '  <script src="project-manager.js" defer></script>\n  <script src="ui-hardening.js" defer></script>\n  <script src="app.js" defer></script>',
              'ui hardening script')
          index_path.write_text(index)

          styles_path = Path('styles.css')
          styles = styles_path.read_text()
          marker = '/* SignalDock v2.6 accessibility and mobile hardening */'
          if marker not in styles:
              styles += dedent('''

              /* SignalDock v2.6 accessibility and mobile hardening */
              html[data-input-modality="keyboard"] :where(button, a, input, select, textarea, [tabindex]):focus-visible {
                outline: 2px solid currentColor;
                outline-offset: 3px;
              }
              html.has-coarse-pointer :where(.button, .icon-button, .nav-item, .source-button, .file-tab) {
                min-height: 44px;
              }
              @media (max-width: 720px) {
                dialog > section { max-width: calc(100vw - 16px); max-height: calc(100dvh - 16px); }
                .matrix-table-wrap, .baseline-table-wrap, .trace-explorer-table-wrap, .trend-table-wrap, .health-table-wrap { overscroll-behavior-x: contain; }
                .query-library-bulkbar, .baseline-history-toolbar { align-items: stretch; }
              }
              @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
              }
              ''')
          styles_path.write_text(styles)

          Path('VERSION').write_text('2.6.0\n')

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = readme.replace('version-2.5.0-', 'version-2.6.0-').replace('SignalDock v2.5.0', 'SignalDock v2.6.0').replace('SignalDock v2.5 can capture', 'SignalDock v2.6 can capture')
          anchor = '- richer Case Checkpoint change summaries across metadata, findings, milestones, attachments and evidence\n'
          if anchor in readme and 'bounded Trace Explorer result windows' not in readme:
              readme = readme.replace(anchor, anchor + '- bounded Trace Explorer result windows with exact global trace counts and lower parent-link memory overhead\n- bounded Service Matrix latency aggregation that switches from exact samples to compact histograms on high-volume edges\n- local File System Access handle registry foundation for project dataset/workspace reopening without uploading file contents\n- dialog focus management, keyboard focus trapping, coarse-pointer touch targets and reduced-motion hardening\n', 1)
          readme_path.write_text(readme)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          entry = dedent('''
          ## 2.6.0 — 2026-09-13

          ### Large-dataset trace and service scaling
          - Reworked Trace Explorer aggregation into a two-pass parent-coverage calculation that no longer retains parent-ID arrays per trace.
          - The application now caches and renders a bounded top trace window while preserving exact global trace/error/incomplete/service summary counts.
          - Service Matrix keeps exact latency samples for normal edges, then promotes high-volume edges to bounded logarithmic histograms while preserving exact call/error/average/max counters.
          - Added an explicit edge safety ceiling and surfaced approximation/limit metadata through the service-matrix API.

          ### Project continuity foundation
          - Storage Adapter now provides a local IndexedDB registry for File System Access handles, permission checks and user-initiated file reopening.
          - Project Manager v3 can associate recent dataset/workspace metadata with opaque local handle references.
          - Portable project exports deliberately strip local handle keys and reopenability flags so filesystem capabilities never leave the browser profile.

          ### Accessibility and mobile hardening
          - Added dialog labelling, focus restoration, keyboard focus trapping, input-modality focus visibility, coarse-pointer touch targets and reduced-motion behavior.
          - Added narrow-viewport dialog/table constraints for mobile investigation workflows.

          ### Quality
          - Added v2.6 scaling/continuity regression coverage and retained the dependency-free syntax, regression, static/CSP, HTTP and CodeQL gates.

          ''')
          if '## 2.6.0 — 2026-09-13' not in changelog:
              changelog = changelog.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog_path.write_text(changelog)

          technical_path = Path('docs/TECHNICAL.md')
          technical = technical_path.read_text().replace('Current version: **2.5.0**.', 'Current version: **2.6.0**.', 1)
          tech_anchor = '- Rich Case Checkpoint diffs across case fields and bounded investigation collections\n'
          if tech_anchor in technical and 'Two-pass Trace Explorer aggregation' not in technical:
              technical = technical.replace(tech_anchor, tech_anchor + '- Two-pass Trace Explorer aggregation with bounded UI windows and exact global summary counters\n- Bounded Service Matrix latency retention using exact small samples and compact histograms for high-volume edges\n- IndexedDB-backed local File System Access handle registry; handle keys are stripped from portable project exports\n- Runtime dialog/focus/mobile accessibility hardening without external dependencies\n', 1)
          technical_path.write_text(technical)

          test_path = Path('tests/v26-ui-hardening-smoke.mjs')
          test_path.write_text(dedent('''
          import fs from 'node:fs'; import path from 'node:path'; import { fileURLToPath } from 'node:url';
          const root=path.resolve(path.dirname(fileURLToPath(import.meta.url)),'..');
          const app=fs.readFileSync(path.join(root,'app.js'),'utf8'); const html=fs.readFileSync(path.join(root,'index.html'),'utf8'); const css=fs.readFileSync(path.join(root,'styles.css'),'utf8'); const ui=fs.readFileSync(path.join(root,'ui-hardening.js'),'utf8');
          const required=[[html,'ui-hardening.js'],[app,'buildWindow'],[app,'summary?.traces'],[css,'SignalDock v2.6 accessibility and mobile hardening'],[css,'prefers-reduced-motion'],[ui,'aria-labelledby'],[ui,'trapTab'],[ui,'has-coarse-pointer']];
          for(const [haystack,token] of required) if(!haystack.includes(token)) throw new Error(`Missing v2.6 integration token: ${token}`);
          console.log('v26-ui-hardening-smoke PASS');
          '''))
          PY

          git rm .github/workflows/v26-integration-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css VERSION README.md CHANGELOG.md docs/TECHNICAL.md tests/v26-ui-hardening-smoke.mjs ui-hardening.js
          git diff --cached --check
          git commit -m "feat: ship SignalDock v2.6 scaling and continuity hardening"
          git push origin HEAD:main
