name: SignalDock v2.8.7 Trace Explorer controller

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  modularize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Align Trace Explorer test fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/v287-trace-explorer-controller.py')
          text = path.read_text()
          old = '  el: { traceExplorerBody: { ownerDocument: {} }, traceCompareButton: compareButton },'
          new = '  el: { traceExplorerDialog: { ownerDocument: {} }, traceCompareButton: compareButton },'
          if text.count(old) != 1:
              raise SystemExit(f'Trace Explorer test fixture: expected 1 match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply v2.8.7 Trace Explorer controller migration
        run: python3 .github/scripts/v287-trace-explorer-controller.py

      - name: Verify release surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "2.8.7"
          grep -Fq 'const APP_VERSION = "2.8.7"' app.js
          grep -Fq 'version-2.8.7-' README.md
          grep -Fq 'SignalDock v2.8.7' README.md
          grep -Fq 'Current version: **2.8.7**.' docs/TECHNICAL.md
          grep -Fq '## 2.8.7 — 2026-09-16' CHANGELOG.md

      - name: Verify JavaScript and regressions
        shell: bash
        env:
          TERM: xterm
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          for test in tests/*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
          git diff --check

      - name: Verify Trace Explorer controller architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f src/app/trace-explorer-controller.js
          grep -Fq 'src/app/trace-explorer-controller.js' index.html
          grep -Fq 'SignalDockTraceExplorerController.create' app.js
          grep -Fq 'traceExplorerController.bind()' app.js
          grep -Fq 'traces: () => traceExplorerController?.open()' app.js
          grep -Fq 'traceExplorerController?.reconcileSelection(state.traceExplorerData)' app.js
          ! grep -Fq 'function openTraceExplorer()' app.js
          ! grep -Fq 'function renderTraceExplorer(' app.js
          ! grep -Fq 'function onTraceExplorerClick(' app.js
          ! grep -Fq 'function openTraceComparison()' app.js
          ! grep -Fq 'function renderTraceComparison(' app.js
          ! grep -Fq 'el.traceExplorerBody?.addEventListener' app.js
          grep -Fq 'traceSampleId' src/app/trace-explorer-controller.js
          grep -Fq 'resolveSampleEntry' src/app/trace-explorer-controller.js
          grep -Fq 'aria-pressed' src/app/trace-explorer-controller.js
          ! grep -Fq '.invoke(' src/app/trace-explorer-controller.js
          ! grep -Fq 'fetch(' src/app/trace-explorer-controller.js
          before_size=$(git show HEAD:app.js | wc -c)
          after_size=$(wc -c < app.js)
          echo "app.js size: ${before_size} -> ${after_size} bytes"
          test "$after_size" -lt "$before_size"

      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/signaldock-v287-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/index.html -o /tmp/signaldock-v287-index.html; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" -eq 1
          for asset in query-library-controller baseline-controller project-controller investigation-controller exception-controller trace-explorer-controller case-workspace-controller case-checkpoint-controller; do
            grep -Fq "src/app/${asset}.js" /tmp/signaldock-v287-index.html
            curl --fail --silent "http://127.0.0.1:8080/src/app/${asset}.js" -o "/tmp/${asset}.js"
          done
          curl --fail --silent http://127.0.0.1:8080/app.js -o /dev/null
          grep -Fq 'SignalDockTraceExplorerController' /tmp/trace-explorer-controller.js

      - name: Commit verified v2.8.7 runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION app.js index.html src/README.md README.md CHANGELOG.md docs/SOURCE-LAYOUT.md docs/TECHNICAL.md tests/*.mjs
          git diff --cached --check
          git commit -m "refactor: extract Trace Explorer application controller"
          git push origin HEAD:main
