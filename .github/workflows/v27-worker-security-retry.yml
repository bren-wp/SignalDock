name: SignalDock v2.7 worker security retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v27-worker-security-retry.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse reviewed worker hardening transform
        shell: bash
        run: |
          set -euo pipefail
          awk '/^          python3 <<'\''PY'\''$/{flag=1;next} flag && /^          PY$/{flag=0;exit} flag{sub(/^          /,""); print}' .github/workflows/v27-worker-security-pass.yml > /tmp/signaldock-worker-hardening.py
          test -s /tmp/signaldock-worker-hardening.py
          python3 /tmp/signaldock-worker-hardening.py
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          for test in tests/*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
          git diff --check
          git rm .github/workflows/v27-worker-security-pass.yml .github/workflows/v27-worker-security-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security: bind filter worker to session protocol"
          git push origin HEAD:main
