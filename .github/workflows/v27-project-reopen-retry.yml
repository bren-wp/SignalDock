name: SignalDock v2.7 project reopen retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v27-project-reopen-retry.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse reviewed v2.7 integration transform
        shell: bash
        run: |
          set -euo pipefail
          awk '/^          python3 <<'\''PY'\''$/{flag=1;next} flag && /^          PY$/{flag=0;exit} flag{sub(/^          /,""); print}' .github/workflows/v27-project-reopen-pass.yml > /tmp/signaldock-v27-integrate.py
          test -s /tmp/signaldock-v27-integrate.py
          python3 /tmp/signaldock-v27-integrate.py
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          for test in tests/*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/signaldock-v27-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/index.html -o /tmp/signaldock-v27-index.html; then ready=1; break; fi
            sleep 0.25
          done
          test "$ready" -eq 1
          grep -q 'desktop-bridge.js' /tmp/signaldock-v27-index.html
          curl --fail --silent http://127.0.0.1:8080/desktop-bridge.js -o /dev/null
          git diff --check
          git rm .github/workflows/v27-project-reopen-pass.yml .github/workflows/v27-project-reopen-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: ship SignalDock v2.7 project reopen workflow"
          git push origin HEAD:main
