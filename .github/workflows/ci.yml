name: SignalDock CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Regression suite
        shell: bash
        env:
          TERM: xterm
        run: |
          set -euo pipefail
          for test in tests/*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
