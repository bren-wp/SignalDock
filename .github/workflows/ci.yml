name: SignalDock CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Regression suite
        shell: bash
        env:
          TERM: xterm
        run: |
          set -euo pipefail
          for test in tests/*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done

      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/signaldock-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/index.html -o /tmp/signaldock-index.html; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" -eq 1
          grep -q 'SignalDock' /tmp/signaldock-index.html
          curl --fail --silent --show-error http://127.0.0.1:8080/app.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/styles.css -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/query-library-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/baseline-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/project-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/inspector-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/settings-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/command-navigation-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/recovery-diagnostics-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/saved-views-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/import-live-tail-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/dataset-filter-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/table-view-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/workspace-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/dataset-overview-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/filter-worker-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/related-context-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/dataset-session-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/case-file-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/query-navigation-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/interaction-shell-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/view-orchestrator-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/element-registry.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/startup-state-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/dataset-view-composition.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/website/index.html -o /tmp/signaldock-website.html
          grep -q 'SignalDock' /tmp/signaldock-website.html
          curl --fail --silent --show-error http://127.0.0.1:8080/website/styles.css -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/website/privacy.html -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/website/security.html -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/investigation-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/exception-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/trace-explorer-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/trace-outlier-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/service-map-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/service-matrix-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/service-heatmap-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/service-trends-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/health-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/case-workspace-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/case-checkpoint-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/core/parser.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/analysis/trace-explorer.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/platform/desktop-bridge.js -o /dev/null
