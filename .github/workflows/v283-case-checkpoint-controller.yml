name: SignalDock v2.8.3 Case Checkpoint controller

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  modularize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Apply v2.8.3 Case Checkpoint controller migration
        run: python3 .github/scripts/v283-case-checkpoint-controller.py

      - name: Verify release surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "2.8.3"
          grep -q 'const APP_VERSION = "2.8.3"' app.js
          grep -q 'version-2.8.3-' README.md
          grep -q 'SignalDock v2.8.3' README.md
          grep -q 'Current version: \*\*2.8.3\*\*\.' docs/TECHNICAL.md
          grep -q '## 2.8.3 — 2026-09-16' CHANGELOG.md

      - name: Verify JavaScript and regressions
        shell: bash
        env:
          TERM: xterm
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          for test in tests/*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
          git diff --check

      - name: Verify Case Checkpoint controller architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f src/app/case-checkpoint-controller.js
          grep -q 'src/app/case-checkpoint-controller.js' index.html
          grep -q 'SignalDockCaseCheckpointController.create' app.js
          grep -q 'caseCheckpointController.bind()' app.js
          grep -q 'caseCheckpointController?.render()' app.js
          ! grep -q 'function createCaseCheckpoint()' app.js
          ! grep -q 'function renderCaseCheckpoints()' app.js
          ! grep -q 'function onCaseCheckpointClick(' app.js
          grep -q 'case.checkpoint.restored' src/app/case-checkpoint-controller.js
          grep -q 'SignalDockCaseCheckpoints' src/app/case-checkpoint-controller.js
          ! grep -q '\.invoke(' src/app/case-checkpoint-controller.js
          ! grep -q 'fetch(' src/app/case-checkpoint-controller.js
          before_size=$(git show HEAD:app.js | wc -c)
          after_size=$(wc -c < app.js)
          echo "app.js size: ${before_size} -> ${after_size} bytes"
          test "$after_size" -lt "$before_size"

      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/signaldock-v283-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/index.html -o /tmp/signaldock-v283-index.html; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" -eq 1
          for asset in query-library-controller baseline-controller project-controller case-checkpoint-controller; do
            grep -q "src/app/${asset}.js" /tmp/signaldock-v283-index.html
            curl --fail --silent "http://127.0.0.1:8080/src/app/${asset}.js" -o "/tmp/${asset}.js"
          done
          curl --fail --silent http://127.0.0.1:8080/app.js -o /dev/null
          grep -q 'SignalDockCaseCheckpointController' /tmp/case-checkpoint-controller.js

      - name: Commit verified v2.8.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION app.js index.html src/app/case-checkpoint-controller.js src/README.md README.md CHANGELOG.md docs/SOURCE-LAYOUT.md docs/TECHNICAL.md tests/*.mjs
          git diff --cached --check
          git commit -m "refactor: extract Case Checkpoint application controller"
          git push origin HEAD:main
