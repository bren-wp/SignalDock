name: SignalDock v2.8 Query Library controller

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  modularize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Align migration with production README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/v280-query-controller.py')
          text = path.read_text()
          old = '''readme = replace_exact(readme, 'Current version: **2.7.4**.', 'Current version: **2.8.0**.', 'README current version')
          needle = '- Baseline History UI with bounded local aggregate snapshots, active-project association, import/export and baseline-to-baseline comparison\\n'
          readme = replace_exact(readme, needle, needle + '- Query Library UI/controller isolated under `src/app/` with explicit state/callback boundaries and no bundler dependency\\n', 'README controller highlight')
          '''
          new = '''readme = replace_exact(readme, 'version-2.7.4-22d3ee', 'version-2.8.0-22d3ee', 'README badge version')
          readme = replace_exact(readme, 'SignalDock v2.7.4 — real application UI with the bundled demo dataset', 'SignalDock v2.8.0 — real application UI with the bundled demo dataset', 'README screenshot caption version')
          readme = replace_exact(readme, 'alt="SignalDock v2.7.4 application screenshot showing local log analysis"', 'alt="SignalDock v2.8.0 application screenshot showing local log analysis"', 'README screenshot alt version')
          needle = '- reusable Query Library with folders and favorites\\n'
          readme = replace_exact(readme, needle, needle + '- feature-level Query Library controller under `src/app/` with explicit state/callback boundaries and no bundler dependency\\n', 'README controller highlight')
          '''
          if old not in text:
              raise SystemExit('README migration block not found in staging script')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply v2.8 controller migration
        run: python3 .github/scripts/v280-query-controller.py

      - name: Synchronize release documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          technical = Path('docs/TECHNICAL.md')
          text = technical.read_text()
          old = 'Current version: **2.7.4**.'
          new = 'Current version: **2.8.0**.'
          if text.count(old) != 1:
              raise SystemExit(f'Technical version marker mismatch: found {text.count(old)}')
          technical.write_text(text.replace(old, new, 1))
          PY
          grep -q 'Current version: \*\*2.8.0\*\*\.' docs/TECHNICAL.md
          grep -q 'version-2.8.0-' README.md
          grep -q 'SignalDock v2.8.0' README.md
          grep -q 'const APP_VERSION = "2.8.0"' app.js
          test "$(cat VERSION)" = "2.8.0"

      - name: Make retained feature gates version-forward
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needle = r'assert.match(version, /^2\.7\.\d+$/);'
          replacement = '''const featureVersionParts = version.split(".").map(Number);
          assert.ok(featureVersionParts.length === 3 && featureVersionParts.every(Number.isFinite) && (featureVersionParts[0] > 2 || (featureVersionParts[0] === 2 && featureVersionParts[1] >= 7)), `expected SignalDock >= 2.7.x, got ${version}`);'''
          changed = []
          for path in Path('tests').glob('*.mjs'):
              text = path.read_text()
              if needle not in text:
                  continue
              path.write_text(text.replace(needle, replacement))
              changed.append(path.name)
          if not changed:
              raise SystemExit('no 2.7-only feature gate assertions found to modernize')
          print('version-forward feature gates:', ', '.join(sorted(changed)))
          PY
          grep -R -nE 'assert\.(equal|match)\(version.*2\.7' tests/*.mjs || true

      - name: Align static foundation test with controller ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/static-foundation-ui-smoke.mjs')
          text = path.read_text()
          old_import = 'const app = read("app.js");\n'
          new_import = 'const app = read("app.js");\nconst queryController = read("src/app/query-library-controller.js");\n'
          if text.count(old_import) != 1:
              raise SystemExit('static foundation app import marker mismatch')
          text = text.replace(old_import, new_import, 1)
          old_block = '''for (const token of [
            'queryLibraryBulkCount: $("queryLibraryBulkCount")',
            'baselineHistoryList: $("baselineHistoryList")',
            'el.queryLibraryBulkSelectVisible?.addEventListener',
            'el.baselineHistoryExportButton?.addEventListener'
          ]) assert.ok(app.includes(token), `static control binding missing: ${token}`);
          '''
          new_block = '''for (const token of [
            'queryLibraryBulkCount: $("queryLibraryBulkCount")',
            'baselineHistoryList: $("baselineHistoryList")',
            'el.baselineHistoryExportButton?.addEventListener'
          ]) assert.ok(app.includes(token), `static app binding missing: ${token}`);
          assert.ok(queryController.includes('listen(el.queryLibraryBulkSelectVisible, "click", selectVisible)'), "Query Library bulk selection listener must be owned by the feature controller");
          '''
          if text.count(old_block) != 1:
              raise SystemExit('static foundation binding assertion block mismatch')
          path.write_text(text.replace(old_block, new_block, 1))
          PY

      - name: Verify JavaScript and regressions
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          for test in tests/*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
          git diff --check

      - name: Verify controller architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "2.8.0"
          test -f src/app/query-library-controller.js
          grep -q 'src/app/query-library-controller.js' index.html
          grep -q 'SignalDockQueryLibraryController.create' app.js
          ! grep -q 'function openQueryLibrary()' app.js
          ! grep -q 'function renderQueryLibrary()' app.js
          ! grep -q 'el.queryLibrarySaveButton?.addEventListener' app.js
          grep -q 'const visibleByFolder = new Map()' src/app/query-library-controller.js
          grep -q 'Move ${item.name} to folder' src/app/query-library-controller.js
          before_size=$(git show HEAD:app.js | wc -c)
          after_size=$(wc -c < app.js)
          echo "app.js size: ${before_size} -> ${after_size} bytes"
          test "$after_size" -lt "$before_size"

      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/signaldock-v280-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/index.html -o /tmp/signaldock-v280-index.html; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" -eq 1
          grep -q 'src/app/query-library-controller.js' /tmp/signaldock-v280-index.html
          curl --fail --silent http://127.0.0.1:8080/app.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8080/src/app/query-library-controller.js -o /tmp/signaldock-query-controller.js
          grep -q 'SignalDockQueryLibraryController' /tmp/signaldock-query-controller.js

      - name: Commit verified v2.8.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION app.js index.html src/app/query-library-controller.js src/README.md README.md CHANGELOG.md docs/SOURCE-LAYOUT.md docs/TECHNICAL.md tests/*.mjs
          git diff --cached --check
          git commit -m "refactor: extract Query Library application controller"
          git push origin HEAD:main
