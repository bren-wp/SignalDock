name: SignalDock v2.8.30 migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2.8.30-migration.yml'
      - 'scripts/migrate-v2.8.30.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Prepare v2.8.30 migration
        run: node scripts/migrate-v2.8.30.mjs
      - name: Verify release surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "2.8.30"
          grep -q 'APP_VERSION = "2.8.30"' app.js
          grep -q 'src/app/view-orchestrator-controller.js' index.html
          grep -q 'SignalDockViewOrchestratorController.create' app.js
          grep -q 'src/app/view-orchestrator-controller.js' .github/workflows/ci.yml
          grep -q 'SignalDockStorageAdapter.readTextFile' app.js
          grep -q 'SignalDock v2.8.30' website/index.html
          grep -q '## 2.8.30 — 2026-09-18' CHANGELOG.md
          grep -q 'Current version: \*\*2.8.30\*\*' docs/TECHNICAL.md
      - name: Recursive JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Full regression suite
        shell: bash
        env:
          TERM: xterm
        run: |
          set -euo pipefail
          for test in tests/*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Architecture, import and mobile assertions
        shell: bash
        run: |
          set -euo pipefail
          view='src/app/view-orchestrator-controller.js'
          settings='src/app/settings-controller.js'
          for token in SignalDockQueryEngine SignalDockStorageAdapter SignalDockPersistence SignalDockFilterWorkerController indexedDB localStorage sessionStorage showOpenFilePicker 'new Worker' '.postMessage(' XMLHttpRequest WebSocket EventSource '.invoke('; do
            if grep -Fq "$token" "$view"; then
              echo "Forbidden capability reference in $view: $token" >&2
              exit 1
            fi
          done
          if grep -Eq '\bfetch[[:space:]]*\(' "$view"; then
            echo "Forbidden fetch() capability in $view" >&2
            exit 1
          fi
          ! grep -Fq 'file.text()' "$settings"
          grep -Fq 'maxParserProfilesImportBytes' "$settings"
          grep -Fq 'currentCustomParserProfile' "$settings"
          grep -Fq 'SignalDockStorageAdapter.readTextFile' app.js
          grep -Fq 'viewOrchestratorController?.renderEverything' app.js
          grep -Fq 'viewOrchestratorController?.renderDataViews' app.js
          grep -Fq 'viewOrchestratorController?.syncLevelChips' app.js
          ! grep -Fq 'function makeUiButton(' app.js
          ! grep -Fq 'function openCommandPalette(' app.js
          ! grep -Fq 'function persistSettingsFromForm(' app.js
          grep -Fq 'min-height: 100dvh' styles.css
          grep -Fq 'env(safe-area-inset-top)' styles.css
          grep -Fq 'env(safe-area-inset-bottom)' styles.css
          grep -Fq '@media (pointer: coarse)' styles.css
          grep -Fq 'touch-action: manipulation' styles.css
          git diff --exit-code -- filter-worker.js
          grep -Fq "connect-src 'none'" index.html
      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/signaldock-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/index.html -o /tmp/signaldock-index.html; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" -eq 1
          curl --fail --silent --show-error http://127.0.0.1:8080/app.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/view-orchestrator-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/settings-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/website/index.html -o /tmp/signaldock-website.html
          grep -q 'SignalDock v2.8.30' /tmp/signaldock-website.html
          curl --fail --silent --show-error http://127.0.0.1:8080/website/privacy.html -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/website/security.html -o /dev/null
      - name: Diff integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
      - name: Commit verified runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION app.js index.html styles.css README.md CHANGELOG.md docs/TECHNICAL.md docs/SOURCE-LAYOUT.md src/README.md src/app/settings-controller.js website/index.html tests/source-layout-smoke.mjs tests/view-orchestrator-controller-smoke.mjs tests/settings-controller-smoke.mjs tests/settings-controller-capability-smoke.mjs tests/production-ui-polish-smoke.mjs tests/website-production-smoke.mjs
          if git diff --cached --quiet; then
            echo 'Migration produced no release changes.' >&2
            exit 1
          fi
          git commit -m 'release: SignalDock v2.8.30'
          git push origin HEAD:main
