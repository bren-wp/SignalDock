name: SignalDock v2.5 UI wiring pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-wire-pass.yml'

permissions:
  contents: write

jobs:
  wire-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Recover and run wiring script
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/ui-wire-pass.yml > /tmp/ui-wire-source.yml
          python3 -c 'from pathlib import Path; lines=Path("/tmp/ui-wire-source.yml").read_text().splitlines(); start=next(i for i,x in enumerate(lines) if "python3 <<\u0027PY\u0027" in x)+1; end=next(i for i in range(start,len(lines)) if lines[i].strip()=="PY"); Path("/tmp/ui-wire.py").write_text("\n".join((x[10:] if x.startswith("          ") else x) for x in lines[start:end])+"\n")'
          python3 /tmp/ui-wire.py

      - name: Commit wired UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css VERSION README.md CHANGELOG.md docs/TECHNICAL.md tests/ui-foundations-smoke.mjs
          git diff --cached --check
          git commit -m "feat: wire v2.5 workspace history UI"
          git push origin HEAD:main
