name: SignalDock v2.8.1 Baseline controller

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  modularize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Apply v2.8.1 Baseline controller migration
        run: python3 .github/scripts/v281-baseline-controller.py

      - name: Align foundation tests with Baseline controller ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/static-foundation-ui-smoke.mjs')
          text = path.read_text()
          old_import = 'const queryController = read("src/app/query-library-controller.js");\n'
          new_import = old_import + 'const baselineController = read("src/app/baseline-controller.js");\n'
          if text.count(old_import) != 1:
              raise SystemExit('static foundation controller import marker mismatch')
          text = text.replace(old_import, new_import, 1)
          old_block = '''for (const token of [
            'queryLibraryBulkCount: $("queryLibraryBulkCount")',
            'baselineHistoryList: $("baselineHistoryList")',
            'el.baselineHistoryExportButton?.addEventListener'
          ]) assert.ok(app.includes(token), `static app binding missing: ${token}`);
          assert.ok(queryController.includes('listen(el.queryLibraryBulkSelectVisible, "click", selectVisible)'), "Query Library bulk selection listener must be owned by the feature controller");
          '''
          new_block = '''for (const token of [
            'queryLibraryBulkCount: $("queryLibraryBulkCount")',
            'baselineHistoryList: $("baselineHistoryList")'
          ]) assert.ok(app.includes(token), `static app registry binding missing: ${token}`);
          assert.ok(queryController.includes('listen(el.queryLibraryBulkSelectVisible, "click", selectVisible)'), "Query Library bulk selection listener must be owned by the feature controller");
          assert.ok(baselineController.includes('listen(el.baselineHistoryExportButton, "click", exportHistory)'), "Baseline history export listener must be owned by the Baseline controller");
          '''
          if text.count(old_block) != 1:
              raise SystemExit('static foundation ownership block mismatch')
          path.write_text(text.replace(old_block, new_block, 1))

          path = Path('tests/ui-foundations-smoke.mjs')
          text = path.read_text()
          old_import = 'const queryController = fs.readFileSync(path.join(root, "src/app/query-library-controller.js"), "utf8");\n'
          new_import = old_import + 'const baselineController = fs.readFileSync(path.join(root, "src/app/baseline-controller.js"), "utf8");\n'
          if text.count(old_import) != 1:
              raise SystemExit('UI foundation controller import marker mismatch')
          text = text.replace(old_import, new_import, 1)
          for token in ['  "compareSavedBaselines",\n', '  "compareById",\n']:
              if text.count(token) != 1:
                  raise SystemExit(f'UI foundation baseline token mismatch: {token!r}')
              text = text.replace(token, '', 1)
          marker = '''for (const token of ["bulkUpdate", "bulkRemove", "exportSelected", "markUsed"]) {
            if (!queryController.includes(token)) throw new Error(`Missing Query Library controller foundation token: ${token}`);
          }
          '''
          addition = marker + '''for (const token of ["renderHistory", "compareById", "baselineHistoryList", "renderComparisonResult"]) {
            if (!baselineController.includes(token)) throw new Error(`Missing Baseline controller foundation token: ${token}`);
          }
          '''
          if text.count(marker) != 1:
              raise SystemExit('UI foundation query controller loop mismatch')
          path.write_text(text.replace(marker, addition, 1))
          PY

      - name: Verify release surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "2.8.1"
          grep -q 'const APP_VERSION = "2.8.1"' app.js
          grep -q 'version-2.8.1-' README.md
          grep -q 'SignalDock v2.8.1' README.md
          grep -q 'Current version: \*\*2.8.1\*\*\.' docs/TECHNICAL.md
          grep -q '## 2.8.1 — 2026-09-16' CHANGELOG.md

      - name: Verify JavaScript and regressions
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          for test in tests/*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
          git diff --check

      - name: Verify Baseline controller architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f src/app/baseline-controller.js
          grep -q 'src/app/baseline-controller.js' index.html
          grep -q 'SignalDockBaselineController.create' app.js
          grep -q 'baselineController.bind()' app.js
          grep -q 'baseline: () => baselineController?.open()' app.js
          ! grep -q 'function openBaseline()' app.js
          ! grep -q 'function renderBaselineHistory()' app.js
          ! grep -q 'function captureBaseline(' app.js
          ! grep -q 'el.captureBaselineButton?.addEventListener' app.js
          grep -q 'let bound = false' src/app/baseline-controller.js
          grep -q 'function destroy()' src/app/baseline-controller.js
          grep -q 'attachBaselineToActiveProject' src/app/baseline-controller.js
          grep -q 'getProjectName' src/app/baseline-controller.js
          before_size=$(git show HEAD:app.js | wc -c)
          after_size=$(wc -c < app.js)
          echo "app.js size: ${before_size} -> ${after_size} bytes"
          test "$after_size" -lt "$before_size"

      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/signaldock-v281-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/index.html -o /tmp/signaldock-v281-index.html; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" -eq 1
          grep -q 'src/app/query-library-controller.js' /tmp/signaldock-v281-index.html
          grep -q 'src/app/baseline-controller.js' /tmp/signaldock-v281-index.html
          curl --fail --silent http://127.0.0.1:8080/app.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8080/src/app/query-library-controller.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8080/src/app/baseline-controller.js -o /tmp/signaldock-baseline-controller.js
          grep -q 'SignalDockBaselineController' /tmp/signaldock-baseline-controller.js

      - name: Commit verified v2.8.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION app.js index.html src/app/baseline-controller.js src/README.md README.md CHANGELOG.md docs/SOURCE-LAYOUT.md docs/TECHNICAL.md tests/*.mjs
          git diff --cached --check
          git commit -m "refactor: extract Baseline application controller"
          git push origin HEAD:main
