name: SignalDock v2.8.32 migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2.8.32-migration.yml'
      - 'scripts/migrate-v2.8.32.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Prepare v2.8.32 migration
        run: node scripts/migrate-v2.8.32.mjs
      - name: Verify release surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "2.8.32"
          grep -q 'APP_VERSION = "2.8.32"' app.js
          grep -q 'src/app/startup-state-controller.js' index.html
          grep -q 'SignalDockStartupStateController.create' app.js
          grep -q 'src/app/startup-state-controller.js' .github/workflows/ci.yml
          grep -q 'SignalDock v2.8.32' website/index.html
          grep -q '## 2.8.32 — 2026-09-18' CHANGELOG.md
          grep -q 'Current version: \*\*2.8.32\*\*' docs/TECHNICAL.md
      - name: Recursive JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Full regression suite
        shell: bash
        env:
          TERM: xterm
        run: |
          set -euo pipefail
          for test in tests/*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Startup state architecture assertions
        shell: bash
        run: |
          set -euo pipefail
          controller='src/app/startup-state-controller.js'
          for token in localStorage sessionStorage indexedDB showOpenFilePicker SignalDockStorageAdapter SignalDockPersistence 'new Worker' '.postMessage(' XMLHttpRequest WebSocket EventSource '.invoke('; do
            if grep -Fq "$token" "$controller"; then
              echo "Forbidden capability reference in $controller: $token" >&2
              exit 1
            fi
          done
          if grep -Eq '\bfetch[[:space:]]*\(' "$controller"; then
            echo "Forbidden fetch() capability in $controller" >&2
            exit 1
          fi
          grep -Fq 'startupStateController.hydratePreferences();' app.js
          grep -Fq 'startupStateController.hydrateInvestigation();' app.js
          grep -Fq 'startupStateController.hydrateBaselineHistory();' app.js
          grep -Fq 'startupStateController.hydrateProjects();' app.js
          grep -Fq 'startupStateController.hydrateCaseCheckpoints();' app.js
          ! grep -Fq 'state.savedViews = utils().loadJson(' app.js
          ! grep -Fq 'state.projects = window.SignalDockProjectManager?.load?.()' app.js
          git diff --exit-code -- filter-worker.js
      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/signaldock-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/index.html -o /tmp/signaldock-index.html; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" -eq 1
          curl --fail --silent --show-error http://127.0.0.1:8080/app.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/src/app/startup-state-controller.js -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/website/index.html -o /tmp/signaldock-website.html
          grep -q 'SignalDock v2.8.32' /tmp/signaldock-website.html
          curl --fail --silent --show-error http://127.0.0.1:8080/website/privacy.html -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/website/security.html -o /dev/null
      - name: Diff integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
      - name: Commit verified runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION app.js index.html README.md CHANGELOG.md docs/TECHNICAL.md docs/SOURCE-LAYOUT.md src/README.md website/index.html tests/source-layout-smoke.mjs tests/startup-state-controller-smoke.mjs tests/website-production-smoke.mjs
          if git diff --cached --quiet; then
            echo 'Migration produced no release changes.' >&2
            exit 1
          fi
          git commit -m 'release: SignalDock v2.8.32'
          git push origin HEAD:main
