name: SignalDock v2.8.6 Exception controller

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  modularize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Align Exception migration boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/v286-exception-controller.py')
          text = path.read_text()
          old = "block_end = app.find('  function openHealth() {', block_start)"
          new = "block_end = app.find('  function renderCaseWorkspace(rebuild = true) {', block_start)"
          if text.count(old) != 1:
              raise SystemExit(f'Exception boundary marker: expected 1 match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply v2.8.6 Exception controller migration
        run: python3 .github/scripts/v286-exception-controller.py

      - name: Verify release surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "2.8.6"
          grep -q 'const APP_VERSION = "2.8.6"' app.js
          grep -q 'version-2.8.6-' README.md
          grep -q 'SignalDock v2.8.6' README.md
          grep -q 'Current version: \*\*2.8.6\*\*\.' docs/TECHNICAL.md
          grep -q '## 2.8.6 — 2026-09-16' CHANGELOG.md

      - name: Verify JavaScript and regressions
        shell: bash
        env:
          TERM: xterm
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          for test in tests/*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
          git diff --check

      - name: Verify Exception controller architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f src/app/exception-controller.js
          grep -q 'src/app/exception-controller.js' index.html
          grep -q 'SignalDockExceptionController.create' app.js
          grep -q 'exceptionController.bind()' app.js
          grep -q 'exceptions: () => exceptionController?.open()' app.js
          ! grep -q 'function openExceptions()' app.js
          ! grep -q 'function renderExceptions()' app.js
          ! grep -q 'function renderExceptionTrend()' app.js
          ! grep -q 'function onExceptionClick(' app.js
          ! grep -q 'el.exceptionList?.addEventListener' app.js
          grep -q 'sampleIds' src/app/exception-controller.js
          grep -q 'composeFingerprintQuery' src/app/exception-controller.js
          ! grep -q '\.invoke(' src/app/exception-controller.js
          ! grep -q 'fetch(' src/app/exception-controller.js
          before_size=$(git show HEAD:app.js | wc -c)
          after_size=$(wc -c < app.js)
          echo "app.js size: ${before_size} -> ${after_size} bytes"
          test "$after_size" -lt "$before_size"

      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/signaldock-v286-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/index.html -o /tmp/signaldock-v286-index.html; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" -eq 1
          for asset in query-library-controller baseline-controller project-controller investigation-controller exception-controller case-workspace-controller case-checkpoint-controller; do
            grep -q "src/app/${asset}.js" /tmp/signaldock-v286-index.html
            curl --fail --silent "http://127.0.0.1:8080/src/app/${asset}.js" -o "/tmp/${asset}.js"
          done
          curl --fail --silent http://127.0.0.1:8080/app.js -o /dev/null
          grep -q 'SignalDockExceptionController' /tmp/exception-controller.js

      - name: Commit verified v2.8.6 runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION app.js index.html src/README.md README.md CHANGELOG.md docs/SOURCE-LAYOUT.md docs/TECHNICAL.md tests/*.mjs
          git diff --cached --check
          git commit -m "refactor: extract Exception Explorer application controller"
          git push origin HEAD:main
