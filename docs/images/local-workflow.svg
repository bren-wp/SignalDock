<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" role="img" aria-labelledby="t d"><title id="t">SignalDock local-first workflow</title><desc id="d">Local files flow into parsing, search, trace analysis and investigation without cloud upload.</desc><rect width="1100" height="250" rx="22" fill="#08131f"/><g font-family="Inter,Segoe UI,Arial" text-anchor="middle"><g fill="#0d1e2c" stroke="#1e3a4e"><rect x="35" y="70" width="190" height="110" rx="16"/><rect x="295" y="70" width="190" height="110" rx="16"/><rect x="555" y="70" width="190" height="110" rx="16"/><rect x="815" y="70" width="250" height="110" rx="16"/></g><g fill="#e8f4fb" font-size="17" font-weight="700"><text x="130" y="116">Your local files</text><text x="390" y="116">Parse + index</text><text x="650" y="116">Explore evidence</text><text x="940" y="116">Case + export</text></g><g fill="#8095a8" font-size="13"><text x="130" y="145">LOG · JSON · NDJSON · ZIP</text><text x="390" y="145">Worker + IndexedDB</text><text x="650" y="145">Queries · traces · services</text><text x="940" y="145">.sdsession · .sdbundle · reports</text></g><g stroke="#2dd4d7" stroke-width="3" fill="none"><path d="M225 125h56"/><path d="m272 118 9 7-9 7"/><path d="M485 125h56"/><path d="m532 118 9 7-9 7"/><path d="M745 125h56"/><path d="m792 118 9 7-9 7"/></g><text x="550" y="218" fill="#5eead4" font-size="14" font-weight="700">NO BACKEND · NO ACCOUNT · NO TELEMETRY · CONNECT-SRC 'NONE'</text></g></svg>