<text x="72" y="225" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="760">On your machine.</text>
<text x="72" y="272" fill="#91a4b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Inspect logs, traces, exceptions and incidents locally — no backend,</text>
<text x="72" y="301" fill="#91a4b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">no account, no telemetry, no cloud ingestion.</text>
