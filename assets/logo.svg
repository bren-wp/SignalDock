<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">SignalDock</title>
  <desc id="desc">A geometric dock-shaped stack made from three cyan and blue diamond layers.</desc>
  <defs>
    <linearGradient id="sd-a" x1="8" y1="6" x2="55" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63f4df"/>
      <stop offset=".48" stop-color="#10d7f1"/>
      <stop offset="1" stop-color="#2889ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M32 7 55 19.5 32 32 9 19.5 32 7Z" fill="none" stroke="url(#sd-a)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="m11 29 21 11 21-11" fill="none" stroke="url(#sd-a)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m11 39 21 11 21-11" fill="none" stroke="url(#sd-a)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 32v18" fill="none" stroke="#26a4ff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
</svg>
